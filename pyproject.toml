[project]
name = "control-de-cultivos"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jorge Arranz", email = "jor.arrgar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "streamlit==1.65.0",
    "pandas",
    "plotly",
    "seaborn",
    "streamlit-aggrid",
    "folium",
    "streamlit-folium",
    "fastapi[standard]>=0.162.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cultivos = "control_de_cultivos:main"




[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "src/user_data_manager",
]
exclude = [
    "src/user_data_manager"
    ]
